services:
  payback-coupons:
    build: .
    image: payback-coupons:local
    env_file: .env
    restart: unless-stopped
    # Run as the host user that owns ./data so you can edit cookies.json.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    init: true # reaps Chromium child processes
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
